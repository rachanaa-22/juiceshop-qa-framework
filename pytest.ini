[pytest]
addopts = --base-url http://localhost:3000 --tracing retain-on-failure --screenshot only-on-failure --video retain-on-failure --html=reports/report.html --self-contained-html --alluredir=allure-results --timeout=90
markers =
    smoke: fast checks that the app is alive
    regression: full functional suite
    api: API-level tests
    a11y: accessibility scans
testpaths = tests

